<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e8eef4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8d4e8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a3c4d9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b8d4e8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle map-like water pattern -->
  <path d="M0 420 Q150 400 300 430 Q450 460 600 420 Q750 380 900 410 Q1050 440 1200 415 L1200 630 L0 630Z" fill="url(#water)"/>
  <path d="M0 460 Q200 440 400 470 Q600 500 800 455 Q1000 410 1200 450 L1200 630 L0 630Z" fill="#a3c4d9" fill-opacity="0.15"/>
  <path d="M0 510 Q180 490 360 520 Q540 550 720 505 Q900 460 1200 500 L1200 630 L0 630Z" fill="#8bb5cc" fill-opacity="0.1"/>

  <!-- Subtle island shapes -->
  <ellipse cx="280" cy="440" rx="60" ry="20" fill="#c8d5c4" fill-opacity="0.4"/>
  <ellipse cx="750" cy="420" rx="45" ry="15" fill="#c8d5c4" fill-opacity="0.35"/>
  <ellipse cx="520" cy="470" rx="35" ry="12" fill="#c8d5c4" fill-opacity="0.3"/>

  <!-- Compass rose hint (top right) -->
  <g transform="translate(1080, 80)" opacity="0.12">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#2c3e50" stroke-width="1"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#2c3e50" stroke-width="1"/>
    <text x="0" y="-50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2c3e50">N</text>
  </g>

  <!-- Icon badge -->
  <rect x="552" y="140" width="96" height="44" rx="22" fill="#2c3e50"/>
  <text x="600" y="168" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#ffffff">SJ</text>

  <!-- Main title -->
  <text x="600" y="265" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#1a2533">San Juan Islands</text>

  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="36" font-weight="400" letter-spacing="0.5" fill="#4a6175">Boating Guide</text>

  <!-- Thin separator -->
  <line x1="540" y1="365" x2="660" y2="365" stroke="#2c3e50" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="400" fill="#7a8fa0">Anchorages, marinas, and local knowledge for cruising the islands</text>
</svg>
